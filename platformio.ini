[env]
platform = ststm32
board = nucleo_g474re
framework = stm32cube
platform_packages =
    toolchain-gccarmnoneeabi@~1.120301.0

upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
extra_scripts = pre:scripts/platformio_fpu.py

build_flags =
    -std=c11
    -Wall
    -Wextra
    -Werror

upload_flags =
    -c
    reset_config srst_only srst_nogate connect_assert_srst

[env:nucleo_g474re]

[env:q3_benchmark]
build_unflags =
    -Os
    -mfloat-abi=soft
build_flags =
    ${env.build_flags}
    -O3
    -DQ3_BENCHMARK

[env:q3_fixed_benchmark]
build_unflags =
    -Os
    -mfloat-abi=soft
build_flags =
